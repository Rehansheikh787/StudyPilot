name: "Daily Study Reminder"

# Sends today's scheduled study sessions from timetable.json every morning.
# This reads the plan you already generated and committed — it does NOT
# call the AI providers, so it costs nothing to run and never fails due
# to a missing/rate-limited API key. Generate + commit a fresh
# timetable.json (via the app, or `python planner.py`) whenever you start
# a new week or replan.

on:
  schedule:
    - cron: "30 1 * * *"  # 1:30 AM UTC == 7:00 AM IST
  workflow_dispatch: {}     # allows manual "Run workflow" from the Actions tab

jobs:
  send-reminder:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send today's study reminder
        run: python reminder.py
        env:
          EMAIL_ID: ${{ secrets.EMAIL_ID }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
